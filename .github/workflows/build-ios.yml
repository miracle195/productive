name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest # Apple Silicon runner with latest Xcode

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Verify Xcode Version
      run: |
        xcodebuild -version

    - name: Build iOS IPA
      run: |
        cd ios-swiftui
        # Build the iOS Archive
        xcodebuild -project Productive.xcodeproj \
                   -scheme Productive \
                   -configuration Release \
                   -destination 'generic/platform=iOS' \
                   -archivePath build/Productive.xcarchive \
                   CODE_SIGNING_ALLOWED=NO \
                   archive

        # Package into unsigned Payload/Productive.app IPA
        mkdir -p build/Payload
        cp -r build/Productive.xcarchive/Products/Applications/Productive.app build/Payload/
        cd build
        zip -r Productive.ipa Payload
        echo "IPA successfully packaged at ios-swiftui/build/Productive.ipa"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Productive-iOS-IPA
        path: ios-swiftui/build/Productive.ipa
        if-no-files-found: error

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v3.2.5-ios
        name: Productive v3.2.5 Native SwiftUI iOS (Clean Non-Wrapping Subtask Tag & Aligned Section Headers)
        files: ios-swiftui/build/Productive.ipa
      continue-on-error: true
