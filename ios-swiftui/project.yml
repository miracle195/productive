name: Productive
options:
  bundleIdPrefix: com.apalon
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
targets:
  Productive:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ProductiveApp.swift
      - path: Models
      - path: ViewModels
      - path: Views
      - path: Widgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apalon.productive.tracker
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: Productive
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "2.4.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO
