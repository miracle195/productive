name: Productive
options:
  bundleIdPrefix: com.apalon
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
targets:
  Productive:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ProductiveApp.swift
      - path: Models
      - path: ViewModels
      - path: Services
      - path: Intents
      - path: Views
      - path: Widgets/DynamicIslandActivity.swift
      - path: Assets.xcassets
    dependencies:
      - target: ProductiveWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apalon.productive.tracker
        INFOPLIST_FILE: Info.plist
        PRODUCT_NAME: Productive
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 17
        MARKETING_VERSION: "3.2.13"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO

  ProductiveWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
      - path: Models/WidgetDailySnapshot.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.apalon.productive.tracker.widgets
        INFOPLIST_FILE: Widgets/Info.plist
        PRODUCT_NAME: ProductiveWidgets
        SWIFT_VERSION: "5.9"
        CURRENT_PROJECT_VERSION: 17
        MARKETING_VERSION: "3.2.13"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO
